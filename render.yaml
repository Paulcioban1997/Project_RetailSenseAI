services:
  - type: web
    name: retailsense-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn API.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: RETAILSENSE_PROJECT_ROOT
        value: /app
      - key: RETAILSENSE_ML_DIR
        value: /app/Machine-Learning
      - key: RETAILSENSE_DL_DIR
        value: /app/Deep-Learning
      - key: RETAILSENSE_SENTIMENT_MODEL_ID
        value: xlm-roberta-base
      - key: RETAILSENSE_DISABLE_TRANSFORMER
        value: "1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: RETAILSENSE_INFERENCE_TIMEOUT_SECONDS
        value: "45"
